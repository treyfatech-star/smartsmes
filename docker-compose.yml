version: '3.9'
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: smartsmes
      POSTGRES_PASSWORD: smartsmes
      POSTGRES_DB: smartsmes
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://smartsmes:smartsmes@postgres:5432/smartsmes?schema=public
      JWT_SECRET: change-me
      PORT: 4000
    depends_on: [postgres]
    ports: ["4000:4000"]

  frontend:
    build: ./frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost/api/v1
    depends_on: [backend]

  nginx:
    image: nginx:1.27
    depends_on: [frontend, backend]
    ports: ["80:80"]
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  pgdata:
